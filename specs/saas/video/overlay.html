<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video overlay</title>
<!-- Rendered by build.py with a transparent background: ?kind=caption|badge|speed|presenter&text=… -->
<style>
@font-face { font-family: "Manrope"; font-weight: 200 800; src: url(../../../crates/agentrix-ui/static/fonts/manrope-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "DM Sans"; font-weight: 100 1000; src: url(../../../crates/agentrix-ui/static/fonts/dm-sans-latin-wght-normal.woff2) format("woff2-variations"); }
html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
.cap { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); max-width: 1500px; text-align: center;
  font: 600 35px/1.3 "DM Sans", sans-serif; color: #fff; background: rgba(23, 21, 48, .84); padding: 16px 30px; border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); text-wrap: balance; }
.badge { position: absolute; left: 96px; top: 13px; display: flex; align-items: center; gap: 14px; background: rgba(23, 21, 48, .9);
  color: #f3f2fb; padding: 10px 22px 10px 12px; border-radius: 999px; font: 700 24px/1 "Manrope", sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.badge svg { width: 36px; height: 36px; }
.badge .dot { width: 13px; height: 13px; border-radius: 50%; background: #ff4f6d; box-shadow: 0 0 0 5px rgba(255,79,109,.25); }
.badge small { font: 600 22px/1 "DM Sans"; color: #c9c7e6; }
.pres { position: absolute; right: 96px; top: 9px; display: flex; align-items: center; gap: 12px; background: rgba(23, 21, 48, .9); color: #f3f2fb;
  padding: 6px 22px 6px 10px; border-radius: 999px; font: 700 22px/1 "Manrope", sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.pres img { width: 44px; height: 48px; }
.pres small { font: 600 20px/1 "DM Sans"; color: #c9c7e6; }
.speed { position: absolute; left: 96px; top: 74px; background: #f4c76b; color: #1f1d3d; padding: 12px 22px; border-radius: 999px; font: 800 25px/1 "Manrope"; }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search), kind = q.get("kind"), text = q.get("text") || "", sub = q.get("sub") || "";
const el = document.createElement("div");
if (kind === "caption") { el.className = "cap"; el.textContent = text; }
else if (kind === "badge") {
  el.className = "badge";
  el.innerHTML = `<svg viewBox="0 0 26 26"><clipPath id="c"><rect width="26" height="26" rx="8"/></clipPath><g clip-path="url(#c)"><rect width="26" height="26" fill="#38356d"/><path d="M13 13 27.86-.38A20 20 0 0 1 3 30.32Z" fill="#de4060"/></g><rect x="7" y="7" width="12" height="12" rx="4" fill="#fff"/></svg><span class="dot"></span><span></span><small></small>`;
  el.children[2].textContent = text; el.children[3].textContent = sub;
}
else if (kind === "speed") { el.className = "speed"; el.textContent = text; }
else if (kind === "presenter") {
  el.className = "pres";
  el.innerHTML = `<img src="../../../crates/agentrix-home/film/marks/chief.svg" alt=""><span></span><small></small>`;
  el.children[1].textContent = text; el.children[2].textContent = sub;
}
document.body.appendChild(el);
window.ready = document.fonts.ready.then(() => true);
</script>
</body>
</html>
