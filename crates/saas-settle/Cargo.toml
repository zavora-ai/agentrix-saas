[package]
name = "saas-settle"
description = "Agentrix SaaS settlement: two AI-run companies settle invoices with each other on PayPal. A2A v1 between their agent doors with Web Bot Auth (RFC 9421) on every request, AP2-style intent and cart mandates checked before any money moves, PayPal Vault capture (Payouts as fallback), one PayPal id posted to both companies' books, and instalment plans inside both owners' mandates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Owner: slice C (settle), specs/saas/README.md. Money moves only through agentrix-effects'
# PayPal client and Payouts; this crate adds the agent door, the mandates and the settlement
# rules in front of them. Migrations 1700–1709, own table.

[dependencies]
a2a-protocol-types = "0.12.1"
adk-auth = { workspace = true, features = ["web-bot-auth"] }
adk-core.workspace = true
adk-server = { workspace = true, features = ["a2a-v1"] }
agentrix-effects.workspace = true
agentrix-host.workspace = true
# The sample doors' proof trait (agentrix-samples never depends on saas-settle).
agentrix-samples.workspace = true
agentrix-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
reqwest.workspace = true
saas-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
saas-core = { workspace = true, features = ["fake"] }
tower.workspace = true
tracing-subscriber.workspace = true
# HTTP mocks of PayPal for the settlement tests.
wiremock = "0.6"

[lints]
workspace = true
